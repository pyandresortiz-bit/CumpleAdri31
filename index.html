<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños Adri</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --pastel-bg-1: #fdf5f6;
            --pastel-bg-2: #fae8eb;
            --pastel-bg-3: #fce4ec;
            --pastel-bg-4: #fff0f5;
            --text-main: #a66a71;
            --text-dark: #6b5256;
            --text-light: #9c8487;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            font-family: 'Playfair Display', serif;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(-45deg, var(--pastel-bg-1), var(--pastel-bg-2), var(--pastel-bg-3), var(--pastel-bg-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .sparkle-container { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .sparkle {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            background-color: rgba(216,150,163,0.4); box-shadow: 0 0 8px rgba(216,150,163,0.6);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; transform: translateY(50vh) scale(1); }
            100% { transform: translateY(-10vh) scale(0); opacity: 0; }
        }

        .content-wrapper { position: relative; z-index: 10; max-width: 800px; margin: 0 auto; padding: 60px 20px 20px; text-align: center; }

        h1 {
            font-family: 'Great Vibes', cursive; color: var(--text-main);
            font-size: clamp(3.5rem, 8vw, 5rem); line-height: 1.1; margin-bottom: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.03); font-weight: 400;
        }
        h2.subtitle { font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 400; color: var(--text-dark); margin-bottom: 15px; }
        .recuerdos-titulo { position: relative; z-index: 10; text-align: center; margin-top: 10px; }
        p.date-detail {
            font-style: italic; color: var(--text-light);
            font-size: clamp(0.95rem, 2.2vw, 1.15rem); letter-spacing: 1px; margin-bottom: 10px;
        }
        .section-title {
            font-family: 'Great Vibes', cursive; color: var(--text-main); font-weight: 400;
            font-size: clamp(3rem, 6vw, 4rem); margin-bottom: 10px;
        }

        /* ---------- 1. Carrusel horizontal ---------- */
        .marquee {
            position: relative; z-index: 10; width: 100%; overflow: hidden; padding: 20px 0 30px;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
        }
        .track { display: flex; gap: 22px; width: max-content; animation: scroll 120s linear infinite; animation-play-state: paused; }
        .marquee.listo .track { animation-play-state: running; }
        .marquee:hover .track, .marquee.pausado .track { animation-play-state: paused; }
        @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(calc(-50% - 11px)); } }
        .card {
            flex: 0 0 auto; height: 400px; padding: 10px; background: #fff; border-radius: 16px;
            box-shadow: 0 12px 28px rgba(166,106,113,0.18);
        }
        .card { position: relative; }
        .card video { display: block; height: 100%; width: auto; border-radius: 9px; background: #000; cursor: pointer; }
        .card .sonido {
            position: absolute; right: 18px; bottom: 18px; font-size: 1rem; line-height: 1;
            background: rgba(255,255,255,0.8); border-radius: 999px; padding: 6px 9px; pointer-events: none;
        }
        .card img { display: block; height: 100%; width: auto; border-radius: 9px; object-fit: contain; background: #f6eef0; }
        @media (max-width: 600px) { .card { height: 380px; } }
        @media (prefers-reduced-motion: reduce) { .track { animation: none; } .marquee { overflow-x: auto; } }

        /* ---------- 2. Frases animadas ---------- */
        .frases { position: relative; z-index: 10; max-width: 800px; margin: 10px auto 20px; padding: 0 20px; text-align: center; }
        .frase-escena { position: relative; height: 150px; display: flex; align-items: center; justify-content: center; }
        .frase {
            font-family: 'Great Vibes', cursive; color: var(--text-main);
            font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1.15; opacity: 0;
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }
        .frase.activa { animation: salta 3.4s ease both; }
        @keyframes salta {
            0%   { opacity: 0; transform: translateY(34px) scale(.92); }
            12%  { opacity: 1; transform: translateY(-12px) scale(1.05); }
            20%  { transform: translateY(0) scale(1); }
            84%  { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-14px) scale(.98); }
        }
        .frase-adorno { color: #d8a5ad; letter-spacing: 12px; font-size: 0.9rem; }
        @media (prefers-reduced-motion: reduce) { .frase.activa { animation: none; opacity: 1; } }

        /* ---------- 3. Video dedicatoria ---------- */
        .videos { position: relative; z-index: 10; max-width: 800px; margin: 0 auto; padding: 0 20px 20px; text-align: center; }
        .youtube-wrapper {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px;
            box-shadow: 0 15px 35px rgba(166,106,113,0.15); background: #000; margin-bottom: 22px; border: 6px solid #fff;
        }
        .youtube-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
        .yt-boton {
            display: inline-block; margin-top: 4px; padding: 10px 22px; border-radius: 999px;
            color: var(--text-main); background: rgba(255,255,255,0.85); border: 1px solid rgba(166,106,113,0.4);
            text-decoration: none; font-size: 1rem; box-shadow: 0 4px 14px rgba(166,106,113,0.15);
        }
        .yt-boton:hover { background: #f6dfe3; }

        footer { position: relative; z-index: 10; margin: 20px 0 50px; text-align: center; font-size: 1.1rem; font-style: italic; color: var(--text-light); }
        footer a { color: var(--text-light); font-size: 0.85rem; opacity: .7; text-decoration: underline dotted; }
        footer a:hover { opacity: 1; }

        #btn-musica {
            position: fixed; top: 14px; right: 14px; z-index: 100;
            font-family: 'Playfair Display', serif; font-size: 0.95rem; color: var(--text-main);
            background: rgba(255,255,255,0.8); border: 1px solid rgba(166,106,113,0.35); border-radius: 999px;
            padding: 8px 16px; cursor: pointer; backdrop-filter: blur(6px); box-shadow: 0 4px 14px rgba(166,106,113,0.15);
        }
        #btn-musica.on { background: #f6dfe3; }
    </style>
</head>
<body>

    <button id="btn-musica" type="button" aria-label="Música de fondo">🎵 Activar música</button>
    <audio id="bgm" src="musica.mp3" loop preload="auto"></audio>

    <div class="sparkle-container" id="sparkles"></div>

    <!-- ENCABEZADO -->
    <header class="content-wrapper">
        <h1>Mi mami más hermosa</h1>
        <h2 class="subtitle">La más guapa, la más churra</h2>
        <p class="date-detail">11 de octubre • 31 años de glamour y belleza insuperable</p>
    </header>

    <!-- FRASES ANIMADAS (encima del carrusel) -->
    <section class="frases" aria-live="polite">
        <div class="frase-escena"><div class="frase" id="frase"></div></div>
        <div class="frase-adorno">✦ ✦ ✦</div>
    </section>

    <!-- CARRUSEL (las fotos se cargan desde el array RECUERDOS del script) -->
    <h2 class="section-title recuerdos-titulo">Nuestros Recuerdos</h2>
    <div class="marquee" id="marquee"><div class="track" id="track"></div></div>

    <!-- VIDEO DE YOUTUBE (al final) -->
    <section class="videos">
        <div class="youtube-wrapper">
            <iframe id="yt"
                src="https://www.youtube.com/embed/a8UXGaE6ZSM?rel=0&enablejsapi=1"
                title="Sorpresa de Cumpleaños"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen></iframe>
        </div>
        <a class="yt-boton" href="https://youtu.be/a8UXGaE6ZSM?feature=shared" target="_blank" rel="noopener">Ver video sorpresa en YouTube ❤️</a>
    </section>

    <footer>
        Hecho con todo nuestro corazón para ti.<br><br>
        <a href="imprimir_tarjetas.html">Tarjetas para imprimir</a>
    </footer>

    <script>
        // ====== CONTENIDO EDITABLE ======
        // Para agregar más fotos: súbelas a la carpeta "fotos/" y añade su ruta aquí.
        // Fotos (.jpg) y videos (.mp4) del carrusel, en el orden en que aparecen.
        const RECUERDOS = [
            'fotos/foto-01.jpg', 'fotos/foto-02.jpg', 'fotos/foto-03.jpg', 'fotos/foto-04.jpg',
            'fotos/foto-05.jpg', 'fotos/foto-06.jpg', 'fotos/foto-07.jpg', 'fotos/foto-08.jpg', 'IMG_5112.mp4',
            'fotos/foto-09.jpg', 'fotos/foto-10.jpg', 'fotos/foto-11.jpg', 'fotos/foto-12.jpg',
            'fotos/foto-13.jpg', 'fotos/foto-14.jpg', 'fotos/foto-15.jpg', 'fotos/foto-16.jpg',
            'fotos/foto-17.jpg', 'fotos/foto-18.jpg', 'fotos/foto-19.jpg', 'fotos/foto-20.jpg', 'video_dedicatoria.mp4',
            'fotos/foto-21.jpg', 'fotos/foto-22.jpg', 'fotos/foto-23.jpg',
            'fotos/foto-24.jpg', 'fotos/foto-25.jpg', 'fotos/foto-26.jpg', 'fotos/foto-27.jpg', 'fotos/foto-28.jpg', 'fotos/foto-29.jpg'
        ];
        const FRASES = [
            'La mami más hermosa',
            'La mami más churra',
            'La mami más servicial',
            'La esposa más atenta',
            'La más simpática y atenta',
            'El alma de nuestra casa',
            'Nuestra alegría todos los días'
        ];
        const VOLUMEN = 0.25;
        const PX_POR_SEGUNDO = 48; // velocidad del carrusel (fluida y elegante)

        // ====== Partículas ======
        const sp = document.getElementById('sparkles');
        for (let i = 0; i < 25; i++) {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.style.left = `${Math.random() * 100}vw`;
            s.style.animationDuration = `${Math.random() * 15 + 10}s`;
            s.style.animationDelay = `-${Math.random() * 10}s`;
            sp.appendChild(s);
        }

        // ====== 1. Carrusel ======
        const marquee = document.getElementById('marquee');
        const track = document.getElementById('track');
        const esVideo = (src) => /\.(mp4|mov|webm)$/i.test(src);
        RECUERDOS.forEach((src, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            if (esVideo(src)) {
                const v = document.createElement('video');
                v.src = src;
                v.autoplay = v.loop = v.muted = v.playsInline = true;
                v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
                v.preload = 'auto';
                card.appendChild(v);
                const ic = document.createElement('span');
                ic.className = 'sonido'; ic.textContent = '🔇';
                card.appendChild(ic);
            } else {
                const img = new Image();
                img.src = src;
                img.alt = `Recuerdo familiar ${i + 1}`;
                img.decoding = 'async';
                card.appendChild(img);
            }
            track.appendChild(card);
        });
        const originales = Array.from(track.children);
        const esperas = Array.from(track.querySelectorAll('img, video')).map(el => {
            if (el.tagName === 'IMG') return el.complete ? 0 : new Promise(r => { el.onload = el.onerror = r; });
            return el.readyState >= 1 ? 0 : new Promise(r => { el.onloadedmetadata = el.onerror = r; });
        });
        Promise.race([Promise.all(esperas), new Promise(r => setTimeout(r, 10000))]).then(() => {
            originales.forEach(c => {
                const copia = c.cloneNode(true);
                copia.setAttribute('aria-hidden', 'true');
                copia.querySelectorAll('video').forEach(v => { v.muted = true; v.play().catch(() => {}); });
                track.appendChild(copia);
            });
            track.querySelectorAll('.card video').forEach(enlazarVideoCarrusel);
            track.style.animationDuration = `${Math.round(track.scrollWidth / 2 / PX_POR_SEGUNDO)}s`;
            marquee.classList.add('listo');
        });
        marquee.addEventListener('touchstart', () => marquee.classList.add('pausado'), {passive: true});
        ['touchend', 'touchcancel'].forEach(ev =>
            marquee.addEventListener(ev, () => marquee.classList.remove('pausado'), {passive: true}));

        // ====== 2. Frases animadas ======
        const frase = document.getElementById('frase');
        let fi = 0;
        function siguienteFrase() {
            frase.classList.remove('activa');
            void frase.offsetWidth; // reinicia la animación
            frase.textContent = FRASES[fi];
            frase.classList.add('activa');
            fi = (fi + 1) % FRASES.length;
        }
        siguienteFrase();
        setInterval(siguienteFrase, 3400);

        // ====== Música de fondo ======
        const audio = document.getElementById('bgm');
        const btn = document.getElementById('btn-musica');
        audio.volume = VOLUMEN;
        let quiereMusica = true;   // false si la persona la pausó a mano
        let videosActivos = 0;     // cuántos videos están sonando ahora

        function pintarBoton() {
            const suena = !audio.paused && !audio.muted;
            btn.classList.toggle('on', suena);
            btn.textContent = suena ? '🎵 Pausar música' : '🎵 Activar música';
        }
        audio.addEventListener('play', pintarBoton);
        audio.addEventListener('pause', pintarBoton);
        audio.addEventListener('volumechange', pintarBoton);

        function reproducir() {
            if (!quiereMusica || videosActivos > 0) return Promise.resolve(false);
            audio.volume = VOLUMEN;
            audio.muted = false;
            return audio.play().then(() => { pintarBoton(); return true; })
                               .catch(() => { pintarBoton(); return false; });
        }

        // Intento de arranque automático; si el navegador lo bloquea, queda en espera
        // y arranca con el primer toque, click, scroll o tecla.
        let arrancada = false;
        function intentarArranque() {
            if (arrancada) return;
            reproducir().then(ok => {
                if (ok) { arrancada = true; quitarEscuchas(); }
            });
        }
        const EVENTOS = ['pointerdown', 'touchstart', 'touchend', 'click', 'keydown', 'wheel', 'scroll'];
        function quitarEscuchas() { EVENTOS.forEach(ev => window.removeEventListener(ev, alGesto, true)); }
        function alGesto(e) { if (!btn.contains(e.target)) intentarArranque(); }
        EVENTOS.forEach(ev => window.addEventListener(ev, alGesto, {capture: true, passive: true}));
        intentarArranque();

        btn.addEventListener('click', () => {
            if (!audio.paused && !audio.muted) {
                quiereMusica = false;
                audio.pause();
            } else {
                quiereMusica = true;
                arrancada = true;
                quitarEscuchas();
                reproducir();
            }
        });

        // ====== Pausar la música mientras suena un video ======
        function videoInicia(id) {
            if (!videoInicia.set.has(id)) { videoInicia.set.add(id); videosActivos = videoInicia.set.size; }
            audio.pause();
        }
        videoInicia.set = new Set();
        function videoTermina(id) {
            videoInicia.set.delete(id);
            videosActivos = videoInicia.set.size;
            if (videosActivos === 0 && quiereMusica && arrancada) reproducir();
        }
        // Videos del carrusel: van en silencio y en bucle; al tocarlos se activa/quita el sonido
        let nVideo = 0;
        function enlazarVideoCarrusel(v) {
            const id = 'carrusel' + (nVideo++);
            const icono = v.parentElement.querySelector('.sonido');
            const sincronizar = () => {
                const conSonido = !v.muted && !v.paused;
                if (icono) icono.textContent = v.muted ? '🔇' : '🔊';
                if (conSonido) videoInicia(id); else videoTermina(id);
            };
            v.addEventListener('click', () => {
                v.muted = !v.muted;
                if (!v.muted) v.play().catch(() => {});
                sincronizar();
            });
            ['volumechange', 'pause', 'ended', 'play'].forEach(ev => v.addEventListener(ev, sincronizar));
        }

        // YouTube (IFrame API)
        function onYouTubeIframeAPIReady() {
            new YT.Player('yt', {
                events: {
                    onStateChange: (e) => {
                        const S = YT.PlayerState;
                        if (e.data === S.PLAYING) videoInicia('yt');
                        else if (e.data === S.PAUSED || e.data === S.ENDED) videoTermina('yt');
                    }
                }
            });
        }
        const apiYT = document.createElement('script');
        apiYT.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(apiYT);
    </script>
</body>
</html>
