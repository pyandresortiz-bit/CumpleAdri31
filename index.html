<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños Adri</title>
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pastel-bg-1: #fdf5f6;
            --pastel-bg-2: #fae8eb;
            --pastel-bg-3: #fce4ec;
            --pastel-bg-4: #fff0f5;
            --text-main: #a66a71;
            --text-dark: #6b5256;
            --text-light: #9c8487;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            font-family: 'Playfair Display', serif;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            /* Fondo de gradiente animado suave */
            background: linear-gradient(-45deg, var(--pastel-bg-1), var(--pastel-bg-2), var(--pastel-bg-3), var(--pastel-bg-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .sparkle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: rgba(216, 150, 163, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(216, 150, 163, 0.6);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; transform: translateY(50vh) scale(1); }
            100% { transform: translateY(-10vh) scale(0); opacity: 0; }
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            color: var(--text-main);
            font-size: clamp(3.5rem, 8vw, 5rem);
            line-height: 1.1;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.03);
        }

        h2.subtitle {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 400;
            color: var(--text-dark);
            margin-bottom: 15px;
        }

        p.date-detail {
            font-style: italic;
            color: var(--text-light);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            letter-spacing: 1px;
            margin-bottom: 50px;
        }

        .youtube-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(166, 106, 113, 0.15);
            background-color: #000; /* Fondo negro por si tarda en cargar */
            margin-bottom: 70px;
            border: 6px solid white;
        }

        .youtube-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .section-title {
            font-family: 'Great Vibes', cursive;
            color: var(--text-main);
            font-size: clamp(3rem, 6vw, 4rem);
            margin-bottom: 30px;
        }

        .polaroid-frame {
            background: white;
            padding: 15px 15px 50px 15px;
            border-radius: 4px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.08), 0 5px 10px rgba(0,0,0,0.04);
            max-width: 500px;
            margin: 0 auto 50px auto;
            position: relative;
            transform: rotate(-1deg);
            transition: transform 0.3s ease;
        }
        
        .polaroid-frame:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .carousel-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4; /* Proporción ideal para fotos verticales o cuadradas */
            overflow: hidden;
            border-radius: 2px;
            background-color: #f0f0f0;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide.active {
            opacity: 1;
            z-index: 2;
        }

        .slide img, .slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .polaroid-caption {
            position: absolute;
            bottom: 12px;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            color: var(--text-main);
        }

        footer {
            margin-top: 40px;
            font-size: 1.1rem;
            font-style: italic;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <!-- Contenedor para las partículas de fondo -->
    <div class="sparkle-container" id="sparkles"></div>

    <main class="content-wrapper">
        <header>
            <h1>Mi mami más hermosa</h1>
            <h2 class="subtitle">La más guapa, la más churra</h2>
            <p class="date-detail">11 de octubre • 31 años de glamour y belleza insuperable</p>
        </header>

        <section>
            <!-- Contenedor responsivo 16:9. Usamos el link embed estándar -->
            <div class="youtube-wrapper">
                <iframe 
                    src="https://www.youtube.com/embed/a8UXGaE6ZSM?rel=0" 
                    title="Sorpresa de Cumpleaños" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        </section>

        <section>
            <h2 class="section-title">Nuestros Recuerdos</h2>
            
            <div class="polaroid-frame">
                <div class="carousel-container" id="carousel">
                    
                    <!-- Archivos listados exactamente como se solicitó -->
                    <div class="slide active">
                        <img src="image.png" alt="Recuerdo familiar 1">
                    </div>
                    <div class="slide">
                        <img src="image_2.png" alt="Recuerdo familiar 2">
                    </div>
                    <div class="slide">
                        <img src="image_3.png" alt="Recuerdo familiar 3">
                    </div>
                    <div class="slide">
                        <img src="image_4.png" alt="Recuerdo familiar 4">
                    </div>
                    <div class="slide">
                        <img src="image_5.png" alt="Recuerdo familiar 5">
                    </div>
                    <div class="slide">
                        <img src="image_6.png" alt="Recuerdo familiar 6">
                    </div>
                    <div class="slide">
                        <img src="image_7.png" alt="Recuerdo familiar 7">
                    </div>
                    <div class="slide">
                        <img src="image_8.png" alt="Recuerdo familiar 8">
                    </div>
                    
                    <!-- Video local con atributos para autoplay en dispositivos móviles -->
                    <div class="slide">
                        <video autoplay muted loop playsinline>
                            <source src="IMG_5112.mp4" type="video/mp4">
                            <source src="IMG_5112.mov" type="video/quicktime">
                        </video>
                    </div>

                </div>
                <div class="polaroid-caption">Con amor...</div>
            </div>
        </section>

        <footer>
            Hecho con todo nuestro corazón para ti.
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. Generador de partículas (chispas) sutiles
            const sparklesContainer = document.getElementById('sparkles');
            const totalSparkles = 25; // Cantidad de partículas

            for (let i = 0; i < totalSparkles; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                
                // Posición horizontal aleatoria
                sparkle.style.left = `${Math.random() * 100}vw`;
                
                // Duración y retraso aleatorios para movimiento natural
                const duration = Math.random() * 15 + 10; // Entre 10s y 25s
                const delay = Math.random() * 10; // Retraso de hasta 10s
                
                sparkle.style.animationDuration = `${duration}s`;
                sparkle.style.animationDelay = `-${delay}s`; // Negativo para que algunas ya estén en pantalla
                
                sparklesContainer.appendChild(sparkle);
            }

            // 2. Lógica del Carrusel (Slideshow)
            const slides = document.querySelectorAll('.slide');
            let currentIndex = 0;
            const timeInterval = 4000; // 4 segundos entre cambios

            function nextSlide() {
                // Quitamos la clase active de la imagen/video actual
                slides[currentIndex].classList.remove('active');
                
                // Avanzamos al siguiente índice (volviendo a 0 si llegamos al final)
                currentIndex = (currentIndex + 1) % slides.length;
                
                // Agregamos la clase active a la nueva imagen/video
                slides[currentIndex].classList.add('active');
            }

            // Iniciar el intervalo
            setInterval(nextSlide, timeInterval);

        });
    </script>
</body>
</html>
