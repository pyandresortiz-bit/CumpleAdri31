<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños Adri</title>
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pastel-bg-1: #fdf5f6;
            --pastel-bg-2: #fae8eb;
            --pastel-bg-3: #fce4ec;
            --pastel-bg-4: #fff0f5;
            --text-main: #a66a71;
            --text-dark: #6b5256;
            --text-light: #9c8487;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            font-family: 'Playfair Display', serif;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            /* Fondo de gradiente animado suave */
            background: linear-gradient(-45deg, var(--pastel-bg-1), var(--pastel-bg-2), var(--pastel-bg-3), var(--pastel-bg-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .sparkle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: rgba(216, 150, 163, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(216, 150, 163, 0.6);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; transform: translateY(50vh) scale(1); }
            100% { transform: translateY(-10vh) scale(0); opacity: 0; }
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            color: var(--text-main);
            font-size: clamp(3.5rem, 8vw, 5rem);
            line-height: 1.1;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.03);
        }

        h2.subtitle {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 400;
            color: var(--text-dark);
            margin-bottom: 15px;
        }

        p.date-detail {
            font-style: italic;
            color: var(--text-light);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            letter-spacing: 1px;
            margin-bottom: 50px;
        }

        .youtube-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(166, 106, 113, 0.15);
            background-color: #000; /* Fondo negro por si tarda en cargar */
            margin-bottom: 70px;
            border: 6px solid white;
        }

        .youtube-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .section-title {
            font-family: 'Great Vibes', cursive;
            color: var(--text-main);
            font-size: clamp(3rem, 6vw, 4rem);
            margin-bottom: 30px;
        }

        /* Carrusel horizontal continuo (marquee) */
        .marquee {
            position: relative;
            width: 100vw;
            left: 50%;
            margin-left: -50vw;
            overflow: hidden;
            padding: 20px 0 30px;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
        }
        .track {
            display: flex;
            gap: 22px;
            width: max-content;
            animation: scroll 90s linear infinite;
        }
        .marquee:hover .track,
        .marquee.pausado .track { animation-play-state: paused; }
        @keyframes scroll {
            from { transform: translateX(0); }
            to   { transform: translateX(calc(-50% - 11px)); }
        }
        .card {
            flex: 0 0 auto;
            height: 400px;
            background: #fff;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(166,106,113,0.18);
        }
        .card img, .card video {
            display: block;
            height: 100%;
            width: auto;
            border-radius: 9px;
            object-fit: contain;
            background: #f6eef0;
        }
        .card video { aspect-ratio: 16 / 9; }
        @media (max-width: 600px) { .card { height: 380px; } }
        @media (prefers-reduced-motion: reduce) {
            .track { animation: none; }
            .marquee { overflow-x: auto; }
        }

        #btn-musica {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 100;
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            color: var(--text-main);
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(166,106,113,0.35);
            border-radius: 999px;
            padding: 8px 16px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 14px rgba(166,106,113,0.15);
            transition: background .3s;
        }
        #btn-musica.on { background: #f6dfe3; }

        footer a { color: var(--text-light); font-size: 0.85rem; opacity: .7; text-decoration: underline dotted; }
        footer a:hover { opacity: 1; }

        footer {
            margin-top: 40px;
            font-size: 1.1rem;
            font-style: italic;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <button id="btn-musica" type="button" aria-pressed="false">🎵 Tocar para escuchar música</button>
    <audio id="bgm" src="musica.mp3" loop preload="none"></audio>

    <!-- Contenedor para las partículas de fondo -->
    <div class="sparkle-container" id="sparkles"></div>

    <main class="content-wrapper">
        <header>
            <h1>Mi mami más hermosa</h1>
            <h2 class="subtitle">La más guapa, la más churra</h2>
            <p class="date-detail">11 de octubre • 31 años de glamour y belleza insuperable</p>
        </header>

        <section>
            <!-- Contenedor responsivo 16:9. Usamos el link embed estándar -->
            <div class="youtube-wrapper">
                <iframe 
                    src="https://www.youtube.com/embed/a8UXGaE6ZSM?rel=0" 
                    title="Sorpresa de Cumpleaños" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        </section>

        <section>
            <h2 class="section-title">Nuestros Recuerdos</h2>
        </section>
    </main>

    <div class="marquee" id="marquee">
        <div class="track" id="track">
                    <div class="card"><img src="image.png" alt="Recuerdo familiar 1"></div>
                    <div class="card"><img src="image_2.png" alt="Recuerdo familiar 2"></div>
                    <div class="card"><img src="image_3.png" alt="Recuerdo familiar 3"></div>
                    <div class="card"><img src="image_4.png" alt="Recuerdo familiar 4"></div>
                    <div class="card"><img src="image_5.png" alt="Recuerdo familiar 5"></div>
                    <div class="card"><img src="image_6.png" alt="Recuerdo familiar 6"></div>
                    <div class="card"><img src="image_7.png" alt="Recuerdo familiar 7"></div>
                    <div class="card"><img src="image_8.png" alt="Recuerdo familiar 8"></div>
                    <div class="card">
                        <video autoplay muted loop playsinline preload="metadata">
                            <source src="IMG_5112.mp4" type="video/mp4">
                            <source src="IMG_5112.mov" type="video/quicktime">
                        </video>
                    </div>
        </div>
    </div>

    <main class="content-wrapper" style="padding-top:20px">
        <footer>
            Hecho con todo nuestro corazón para ti.<br><br>
            <a href="imprimir_tarjetas.html">Tarjetas para imprimir</a>
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. Generador de partículas (chispas) sutiles
            const sparklesContainer = document.getElementById('sparkles');
            const totalSparkles = 25; // Cantidad de partículas

            for (let i = 0; i < totalSparkles; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                
                // Posición horizontal aleatoria
                sparkle.style.left = `${Math.random() * 100}vw`;
                
                // Duración y retraso aleatorios para movimiento natural
                const duration = Math.random() * 15 + 10; // Entre 10s y 25s
                const delay = Math.random() * 10; // Retraso de hasta 10s
                
                sparkle.style.animationDuration = `${duration}s`;
                sparkle.style.animationDelay = `-${delay}s`; // Negativo para que algunas ya estén en pantalla
                
                sparklesContainer.appendChild(sparkle);
            }

            // 2. Carrusel continuo: duplicamos las tarjetas para el bucle infinito
            const track = document.getElementById('track');
            const marquee = document.getElementById('marquee');
            Array.from(track.children).forEach(c => {
                const copia = c.cloneNode(true);
                copia.setAttribute('aria-hidden', 'true');
                track.appendChild(copia);
            });
            // Pausa con el dedo (en celular)
            marquee.addEventListener('touchstart', () => marquee.classList.add('pausado'), {passive: true});
            ['touchend', 'touchcancel'].forEach(ev =>
                marquee.addEventListener(ev, () => marquee.classList.remove('pausado'), {passive: true}));

            // 3. Música de fondo (el navegador exige un toque previo: botón o primer toque en pantalla)
            const audio = document.getElementById('bgm');
            const btn = document.getElementById('btn-musica');
            audio.volume = 0.25;
            const ETQ_OFF = '🎵 Tocar para escuchar música';
            const ETQ_ON = '🎵 Pausar música';

            function estado(sonando) {
                btn.classList.toggle('on', sonando);
                btn.textContent = sonando ? ETQ_ON : ETQ_OFF;
                btn.setAttribute('aria-pressed', String(sonando));
            }
            function reproducir() {
                audio.muted = false;
                audio.volume = 0.25;
                return audio.play().then(() => { estado(true); return true; })
                                   .catch(() => { estado(false); return false; });
            }

            btn.addEventListener('click', () => {
                intentoInicial = true;
                if (audio.paused) reproducir(); else { audio.pause(); estado(false); }
            });

            // Primer toque en cualquier parte: intenta iniciar la música
            let intentoInicial = false;
            const primerToque = (e) => {
                if (intentoInicial || btn.contains(e.target)) return;
                intentoInicial = true;
                reproducir();
            };
            ['pointerdown', 'touchend', 'keydown'].forEach(ev =>
                document.addEventListener(ev, primerToque, {once: false, passive: true}));

        });
    </script>
</body>
</html>
